name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS IPA (Nitya Gita)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Xcode toolchain
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS native project (CNG)
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods
        run: |
          cd ios
          LANG=en_US.UTF-8 pod install

      - name: Build unsigned Release .app
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package NityaGita-unsigned.ipa
        run: |
          APP_PATH=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "Packaging $APP_PATH"
          mkdir -p build_ipa/Payload
          cp -R "$APP_PATH" build_ipa/Payload/
          cd build_ipa
          zip -r -y ../NityaGita-unsigned.ipa Payload

      - name: Upload NityaGita-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NityaGita-unsigned-ipa
          path: NityaGita-unsigned.ipa
          retention-days: 14
